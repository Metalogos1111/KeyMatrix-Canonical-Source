name: NITRO Writer Source Extraction v1

on:
  push:
    branches: ["controlled/dependency-lock-build-001"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_ARCHIVE_SHA256: 8d9200e8a91b432de9abbf976060ce6037fadbae8972e814fb13d5035c7eb40c
      EXPECTED_ENGINEERING_SHA256: 06ed683e3b2e05edcda1da9f54a281bfab27c5d9d72907cd9ca18bfd5ba9622e
      EXPECTED_PACKAGE_JSON_SHA256: 4be3b95d4fb86fae18a48daa5f675cd6031741394e645ac84764e7189a940a54
      EXPECTED_CANDIDATE_LOCK_SHA256: 91c02f58775201f63877e2c03acfee7ceacfc4e5f0feeb3dd4df1a4c4f351acc
      EXPECTED_NODE: 22.16.0
      EXPECTED_NPM: 10.9.2

    steps:
      - name: Checkout controlled build branch
        uses: actions/checkout@v4
        with:
          ref: controlled/dependency-lock-build-001
          fetch-depth: 1

      - name: Install exact Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${EXPECTED_NODE}"
          test "$(npm --version)" = "${EXPECTED_NPM}"

      - name: Verify canonical inputs and extract engineering snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: 10082912240
          EXPECTED_CANDIDATE_ARTIFACT_SHA256: 5b68db15029b8215ad1bb96a4e513ec631502cbe8f5f826137cf5313324018f2
        run: |
          set -euo pipefail
          test -f KEYMATRIX_CANONICAL_SOURCE_001.zip
          test "$(sha256sum KEYMATRIX_CANONICAL_SOURCE_001.zip | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            -o candidate-artifact.zip
          test "$(sha256sum candidate-artifact.zip | awk '{print $1}')" = "$EXPECTED_CANDIDATE_ARTIFACT_SHA256"
          rm -rf candidate-artifact extracted
          mkdir -p candidate-artifact extracted
          unzip -q candidate-artifact.zip -d candidate-artifact
          test -f candidate-artifact/package-lock.candidate.json
          test "$(sha256sum candidate-artifact/package-lock.candidate.json | awk '{print $1}')" = "$EXPECTED_CANDIDATE_LOCK_SHA256"
          unzip -q KEYMATRIX_CANONICAL_SOURCE_001.zip -d extracted
          tgz="extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/keymatrix-grok-engineering.tgz"
          test -f "$tgz"
          test "$(sha256sum "$tgz" | awk '{print $1}')" = "$EXPECTED_ENGINEERING_SHA256"
          mkdir -p extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace
          tar -xzf "$tgz" -C extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace

      - name: Locate workspace and bind candidate lock
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace"
          if test -f "$root/package.json"; then root="$root"; \
          elif test -f "$root/keymatrix-grok-engineering/package.json"; then root="$root/keymatrix-grok-engineering"; \
          else echo 'package.json not found after snapshot extraction' >&2; exit 1; fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          test "$(sha256sum "$root/package.json" | awk '{print $1}')" = "$EXPECTED_PACKAGE_JSON_SHA256"
          cp candidate-artifact/package-lock.candidate.json "$root/package-lock.json"
          test "$(sha256sum "$root/package-lock.json" | awk '{print $1}')" = "$EXPECTED_CANDIDATE_LOCK_SHA256"

      - name: Install candidate dependency tree
        working-directory: ${{ steps.workspace.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules .vercel .output dist build
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Extract exact Nitro writer source
        id: evidence
        working-directory: ${{ steps.workspace.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          nitro_pkg="$(node -e "console.log(require.resolve('nitro/package.json'))")"
          nitro_dir="$(dirname "$nitro_pkg")"
          writer="$nitro_dir/dist/_build/common.mjs"
          test -f "$nitro_pkg"
          test -f "$writer"
          {
            echo '=== EVIDENCE HEADER ==='
            echo 'purpose=exact local Nitro writer source extraction; read-only'
            echo "git_head=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "nitro_package=$nitro_pkg"
            echo "nitro_writer=$writer"
            echo "nitro_package_sha256=$(sha256sum "$nitro_pkg" | awk '{print $1}')"
            echo "nitro_writer_sha256=$(sha256sum "$writer" | awk '{print $1}')"
            echo
            echo '=== NITRO PACKAGE METADATA ==='
            node -e "const p=require('$nitro_pkg'); console.log(JSON.stringify({name:p.name,version:p.version,exports:p.exports},null,2))"
            echo
            echo '=== BUILDINFOPATH MATCHES ==='
            grep -n -E 'buildInfoPath|Generated \\.vercel/output/nitro\\.json|nitro\\.json' "$writer" | head -100 || true
            echo
            echo '=== SOURCE AROUND BUILDINFO WRITER ==='
            line="$(grep -n -m1 'buildInfoPath' "$writer" | cut -d: -f1 || true)"
            if test -n "$line"; then
              start=$((line-30));
              test "$start" -lt 1 && start=1
              end=$((line+45))
              nl -ba "$writer" | sed -n "${start},${end}p"
            else
              echo 'buildInfoPath not found'
              exit 2
            fi
            echo
            echo '=== TIME SOURCE REFERENCES IN LOCAL WRITER ==='
            grep -n -E 'SOURCE_DATE_EPOCH|new Date\\(|Date\\.now\\(|\.toJSON\\(\)|mtime|date:' "$writer" | head -200 || true
            echo
            echo '=== SOURCE_DATE_EPOCH ACROSS INSTALLED NITRO PACKAGE ==='
            grep -RIn --binary-files=without-match --exclude='*.map' -E 'SOURCE_DATE_EPOCH|source.?date.?epoch' "$nitro_dir" 2>/dev/null | head -200 || true
            echo
            echo '=== BUILDINFO / WRITER REFERENCES ACROSS INSTALLED NITRO PACKAGE ==='
            grep -RIn --binary-files=without-match --exclude='*.map' -E 'buildInfoPath|Generated \\.vercel/output/nitro\\.json|writeFile.*nitro|nitro.*writeFile' "$nitro_dir" 2>/dev/null | head -200 || true
          } | tee "$GITHUB_WORKSPACE/nitro-writer-source-v1.txt"
          cp "$writer" "$GITHUB_WORKSPACE/nitro-common.mjs"
          sha256sum "$writer" | tee "$GITHUB_WORKSPACE/nitro-common.mjs.sha256"
          sha256sum "$nitro_pkg" | tee "$GITHUB_WORKSPACE/nitro-package.json.sha256"

      - name: Publish exact source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitro-writer-source-extraction-v1-${{ github.sha }}
          if-no-files-found: error
          path: |
            nitro-writer-source-v1.txt
            nitro-common.mjs
            nitro-common.mjs.sha256
            nitro-package.json.sha256
          compression-level: 6
          overwrite: false
