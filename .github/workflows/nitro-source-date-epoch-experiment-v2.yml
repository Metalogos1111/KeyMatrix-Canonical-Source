name: NITRO SOURCE_DATE_EPOCH Remediation Experiment v2

on:
  push:
    branches: ["controlled/nitro-source-date-epoch-experiment-001"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  EXPECTED_ARCHIVE_SHA256: 8d9200e8a91b432de9abbf976060ce6037fadbae8972e814fb13d5035c7eb40c
  EXPECTED_ENGINEERING_SHA256: 06ed683e3b2e05edcda1da9f54a281bfab27c5d9d72907cd9ca18bfd5ba9622e
  EXPECTED_PACKAGE_JSON_SHA256: 4be3b95d4fb86fae18a48daa5f675cd6031741394e645ac84764e7189a940a54
  EXPECTED_CANDIDATE_LOCK_SHA256: 91c02f58775201f63877e2c03acfee7ceacfc4e5f0feeb3dd4df1a4c4f351acc
  EXPECTED_CANDIDATE_ARTIFACT_SHA256: 5b68db15029b8215ad1bb96a4e513ec631502cbe8f5f826137cf5313324018f2
  CANDIDATE_ARTIFACT_ID: 10082912240
  EXPECTED_NODE: 22.16.0
  EXPECTED_NPM: 10.9.2
  SOURCE_DATE_EPOCH: 1757370000

jobs:
  experiment:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: controlled/nitro-source-date-epoch-experiment-001
          fetch-depth: 1

      - name: Install exact Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Verify toolchain
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${EXPECTED_NODE}"
          test "$(npm --version)" = "${EXPECTED_NPM}"
          test "${SOURCE_DATE_EPOCH}" = "1757370000"

      - name: Prepare exact candidate workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f KEYMATRIX_CANONICAL_SOURCE_001.zip
          test "$(sha256sum KEYMATRIX_CANONICAL_SOURCE_001.zip | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            -o candidate-artifact.zip
          test "$(sha256sum candidate-artifact.zip | awk '{print $1}')" = "$EXPECTED_CANDIDATE_ARTIFACT_SHA256"
          unzip -q candidate-artifact.zip -d candidate-artifact
          test "$(sha256sum candidate-artifact/package-lock.candidate.json | awk '{print $1}')" = "$EXPECTED_CANDIDATE_LOCK_SHA256"
          unzip -q KEYMATRIX_CANONICAL_SOURCE_001.zip -d extracted
          tgz="extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/keymatrix-grok-engineering.tgz"
          test "$(sha256sum "$tgz" | awk '{print $1}')" = "$EXPECTED_ENGINEERING_SHA256"
          mkdir -p extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace
          tar -xzf "$tgz" -C extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace
          ROOT="extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace"
          if test -f "$ROOT/package.json"; then :
          elif test -f "$ROOT/keymatrix-grok-engineering/package.json"; then ROOT="$ROOT/keymatrix-grok-engineering"
          else echo 'package.json not found' >&2; exit 1; fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          test "$(sha256sum "$ROOT/package.json" | awk '{print $1}')" = "$EXPECTED_PACKAGE_JSON_SHA256"
          cp candidate-artifact/package-lock.candidate.json "$ROOT/package-lock.json"
          test "$(sha256sum "$ROOT/package-lock.json" | awk '{print $1}')" = "$EXPECTED_CANDIDATE_LOCK_SHA256"

      - name: Install candidate dependency tree
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          rm -rf node_modules .vercel .output dist build
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply controlled Nitro patch in node_modules only
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          nitro_pkg="$(node -e "console.log(require.resolve('nitro/package.json'))")"
          writer="$(dirname "$nitro_pkg")/dist/_build/common.mjs"
          test -f "$writer"
          cp "$writer" "$GITHUB_WORKSPACE/nitro-before.mjs"
          sha256sum "$writer" | tee "$GITHUB_WORKSPACE/nitro-before.sha256"
          python3 - "$writer" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          target='date: (/* @__PURE__ */ new Date()).toJSON(),'
          replacement='date: (/* @__PURE__ */ process.env.SOURCE_DATE_EPOCH ? new Date(process.env.SOURCE_DATE_EPOCH * 1000) : new Date()).toJSON(),'
          count=s.count(target)
          if count != 2:
              raise SystemExit(f'nitro date target count={count}, expected=2')
          s=s.replace(target,replacement)
          replacements=[
          ('mtime: stat.mtime.toJSON(),','mtime: (process.env.SOURCE_DATE_EPOCH ? new Date(process.env.SOURCE_DATE_EPOCH * 1000) : stat.mtime).toJSON(),'),
          ('const mtime = await promises.stat(fsPath).then((s) => s.mtime.toJSON());','const mtime = process.env.SOURCE_DATE_EPOCH ? new Date(process.env.SOURCE_DATE_EPOCH * 1000).toJSON() : await promises.stat(fsPath).then((s) => s.mtime.toJSON());')]
          for old,new in replacements:
              print(f'REPLACEMENT_COUNT={s.count(old)} TARGET={old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          cp "$writer" "$GITHUB_WORKSPACE/nitro-after.mjs"
          sha256sum "$writer" | tee "$GITHUB_WORKSPACE/nitro-after.sha256"
          {
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            echo "nitro_pkg=$nitro_pkg"
            echo "writer=$writer"
            echo 'repository source untouched; patch exists only in installed node_modules'
            echo '=== BEFORE ==='
            grep -n -E 'SOURCE_DATE_EPOCH|new Date\\(|mtime|date:' "$GITHUB_WORKSPACE/nitro-before.mjs" | head -200 || true
            echo '=== AFTER ==='
            grep -n -E 'SOURCE_DATE_EPOCH|new Date\\(|mtime|date:' "$writer" | head -200 || true
          } | tee "$GITHUB_WORKSPACE/remediation-patch.txt"

      - name: Controlled clean build 1
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          rm -rf .vercel .output dist build
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/build-1.log"
          test -f .vercel/output/nitro.json
          cp .vercel/output/nitro.json "$GITHUB_WORKSPACE/nitro-build-1.json"
          sha256sum .vercel/output/nitro.json | tee "$GITHUB_WORKSPACE/nitro-build-1.sha256"
          find .vercel/output -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/manifest-1.sha256"

      - name: Controlled clean build 2
        working-directory: ${{ env.ROOT }}
        run: |
          set -euo pipefail
          rm -rf .vercel .output dist build
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/build-2.log"
          test -f .vercel/output/nitro.json
          cp .vercel/output/nitro.json "$GITHUB_WORKSPACE/nitro-build-2.json"
          sha256sum .vercel/output/nitro.json | tee "$GITHUB_WORKSPACE/nitro-build-2.sha256"
          find .vercel/output -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/manifest-2.sha256"

      - name: Verify determinism
        run: |
          set -euo pipefail
          cmp -s "$GITHUB_WORKSPACE/nitro-build-1.json" "$GITHUB_WORKSPACE/nitro-build-2.json"
          cmp -s "$GITHUB_WORKSPACE/manifest-1.sha256" "$GITHUB_WORKSPACE/manifest-2.sha256"
          {
            echo 'nitro_json_byte_equal=PASS'
            echo 'full_output_manifest_equal=PASS'
            echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
            cat "$GITHUB_WORKSPACE/nitro-build-1.sha256"
            cat "$GITHUB_WORKSPACE/nitro-build-2.sha256"
          } | tee "$GITHUB_WORKSPACE/determinism-result.txt"

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitro-source-date-epoch-experiment-v2-${{ github.sha }}
          if-no-files-found: error
          path: |
            nitro-before.mjs
            nitro-before.sha256
            nitro-after.mjs
            nitro-after.sha256
            remediation-patch.txt
            build-1.log
            build-2.log
            nitro-build-1.json
            nitro-build-2.json
            nitro-build-1.sha256
            nitro-build-2.sha256
            manifest-1.sha256
            manifest-2.sha256
            determinism-result.txt
          compression-level: 6
          overwrite: false
