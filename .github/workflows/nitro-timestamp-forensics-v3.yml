name: NITRO Timestamp Forensics v3

on:
  push:
    branches: ["controlled/dependency-lock-build-001"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_ARCHIVE_SHA256: 8d9200e8a91b432de9abbf976060ce6037fadbae8972e814fb13d5035c7eb40c
      EXPECTED_ENGINEERING_SHA256: 06ed683e3b2e05edcda1da9f54a281bfab27c5d9d72907cd9ca18bfd5ba9622e
      EXPECTED_PACKAGE_JSON_SHA256: 4be3b95d4fb86fae18a48daa5f675cd6031741394e645ac84764e7189a940a54
      EXPECTED_CANDIDATE_LOCK_SHA256: 91c02f58775201f63877e2c03acfee7ceacfc4e5f0feeb3dd4df1a4c4f351acc
      EXPECTED_CANDIDATE_ARTIFACT_SHA256: 5b68db15029b8215ad1bb96a4e513ec631502cbe8f5f826137cf5313324018f2
      CANDIDATE_ARTIFACT_ID: 10082912240
      EXPECTED_NODE: 22.16.0
      EXPECTED_NPM: 10.9.2

    steps:
      - name: Checkout controlled build branch
        uses: actions/checkout@v4
        with:
          ref: controlled/dependency-lock-build-001
          fetch-depth: 1

      - name: Install exact Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          check-latest: false

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${EXPECTED_NODE}"
          test "$(npm --version)" = "${EXPECTED_NPM}"

      - name: Verify canonical archive and candidate lock inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f KEYMATRIX_CANONICAL_SOURCE_001.zip
          test "$(sha256sum KEYMATRIX_CANONICAL_SOURCE_001.zip | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            -o candidate-artifact.zip
          test "$(sha256sum candidate-artifact.zip | awk '{print $1}')" = "$EXPECTED_CANDIDATE_ARTIFACT_SHA256"
          rm -rf candidate-artifact extracted
          mkdir -p candidate-artifact extracted
          unzip -q candidate-artifact.zip -d candidate-artifact
          test -f candidate-artifact/package-lock.candidate.json
          test "$(sha256sum candidate-artifact/package-lock.candidate.json | awk '{print $1}')" = "$EXPECTED_CANDIDATE_LOCK_SHA256"
          unzip -q KEYMATRIX_CANONICAL_SOURCE_001.zip -d extracted
          tgz="extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/keymatrix-grok-engineering.tgz"
          test -f "$tgz"
          test "$(sha256sum "$tgz" | awk '{print $1}')" = "$EXPECTED_ENGINEERING_SHA256"
          mkdir -p extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace
          tar -xzf "$tgz" -C extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace

      - name: Locate workspace and bind candidate lock
        id: workspace
        shell: bash
        run: |
          set -euo pipefail
          root="extracted/KEYMATRIX_CANONICAL_SOURCE_001/engineering-snapshot/workspace"
          if test -f "$root/package.json"; then root="$root"; \
          elif test -f "$root/keymatrix-grok-engineering/package.json"; then root="$root/keymatrix-grok-engineering"; \
          else echo 'package.json not found after snapshot extraction' >&2; exit 1; fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          actual_pkg="$(sha256sum "$root/package.json" | awk '{print $1}')"
          test "$actual_pkg" = "$EXPECTED_PACKAGE_JSON_SHA256"
          cp candidate-artifact/package-lock.candidate.json "$root/package-lock.json"
          test "$(sha256sum "$root/package-lock.json" | awk '{print $1}')" = "$EXPECTED_CANDIDATE_LOCK_SHA256"

      - name: Install candidate dependency tree
        working-directory: ${{ steps.workspace.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules .vercel .output dist build
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Build once and capture actual generated nitro output
        id: build
        working-directory: ${{ steps.workspace.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee "$GITHUB_WORKSPACE/nitro-build-v3.log"
          test -f .vercel/output/nitro.json
          cp .vercel/output/nitro.json "$GITHUB_WORKSPACE/generated-nitro.json"
          sha256sum .vercel/output/nitro.json | tee "$GITHUB_WORKSPACE/generated-nitro.sha256"
          find .vercel/output -maxdepth 2 -type f -printf '%p\n' | sort > "$GITHUB_WORKSPACE/generated-output-files.txt"

      - name: Locate exact writer across source, dependency tree and build output
        working-directory: ${{ steps.workspace.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== GIT HEAD ==='
            git rev-parse HEAD
            echo '=== PACKAGE RESOLUTION ==='
            node -e "for (const p of ['nitro/package.json','nitropack/package.json']) { try { const r=require.resolve(p); const j=require(r); console.log(p+'='+r); console.log('name='+j.name); console.log('version='+j.version); console.log('exports='+JSON.stringify(j.exports)); } catch (_) {} }"
            echo '=== FILES NAMED nitro.json ==='
            find . node_modules -type f -name 'nitro.json' -print 2>/dev/null | sort | head -200 || true
            echo '=== EXACT GENERATOR PHRASES ==='
            grep -RIn --binary-files=without-match --exclude='*.map' --exclude='package-lock.json' -E 'Generated \.vercel/output/nitro\.json|\.vercel/output/nitro\.json|nitro\.json' . node_modules 2>/dev/null | head -500 || true
            echo '=== VERCEL PRESET / OUTPUT WRITERS ==='
            grep -RIn --binary-files=without-match --exclude='*.map' --exclude='package-lock.json' -E 'preset.{0,20}vercel|writeFile.{0,80}nitro|nitro.{0,80}writeFile|writeFileSync.{0,80}nitro|outputDir.{0,80}nitro' node_modules 2>/dev/null | head -500 || true
            echo '=== TIME SOURCE REFERENCES ==='
            grep -RIn --binary-files=without-match --exclude='*.map' --exclude='package-lock.json' -E 'SOURCE_DATE_EPOCH|source.?date.?epoch|Date\.now\(|new Date\(|Date\(|timestamp|date:' node_modules 2>/dev/null | head -500 || true
            echo '=== BUILD LOG NITRO EVENTS ==='
            grep -n -E 'nitro|\.vercel/output/nitro\.json|Generated' "$GITHUB_WORKSPACE/nitro-build-v3.log" | head -300 || true
          } | tee "$GITHUB_WORKSPACE/nitro-writer-forensics-v3.txt"

      - name: Publish v3 forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitro-timestamp-forensics-v3-${{ github.sha }}
          if-no-files-found: error
          path: |
            nitro-writer-forensics-v3.txt
            nitro-build-v3.log
            generated-nitro.json
            generated-nitro.sha256
            generated-output-files.txt
          compression-level: 6
          overwrite: false
