name: Build Artifact Determinism Candidate Diagnostic

on:
  push:
    branches:
      - controlled/dependency-lock-build-001
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    name: Diagnose candidate artifact binding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANDIDATE_ARTIFACT_ID: 10082912240
      EXPECTED_CANDIDATE_ARTIFACT_SHA256: 5b68db15029b8215ad1bb96a4e513ec631502cbe8f5f826137cf5313324018f2
      EXPECTED_CANDIDATE_LOCK_SHA256: 91c02f58775201f63877e2c03acfee7ceacfc4e5f0feeb3dd4df1a4c4f351acc
    steps:
      - name: Checkout controlled build branch
        uses: actions/checkout@v4

      - name: Diagnose artifact API metadata
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          set +e
          curl -sS -D artifact-api.headers \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}" \
            -o artifact-api.json
          rc=$?
          echo "curl_metadata_rc=$rc"
          echo "http_status=$(awk 'NR==1 {print $2}' artifact-api.headers)"
          if test -s artifact-api.json; then
            grep -E '"id"|"name"|"size_in_bytes"|"expired"|"digest"|"workflow_run"|"head_branch"|"head_sha"' artifact-api.json || true
          fi
          exit 0

      - name: Diagnose artifact download and SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          set +e
          curl -sS -L -D artifact-download.headers \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            -o candidate-artifact.zip
          rc=$?
          echo "curl_download_rc=$rc"
          echo "initial_http_status=$(awk 'NR==1 {print $2}' artifact-download.headers)"
          if test -f candidate-artifact.zip; then
            sha256sum candidate-artifact.zip
            unzip -t candidate-artifact.zip
          fi
          exit 0

      - name: Diagnose candidate lock contents
        shell: bash
        run: |
          set -u
          set +e
          if test -f candidate-artifact.zip; then
            rm -rf candidate-artifact
            unzip -q candidate-artifact.zip -d candidate-artifact
            find candidate-artifact -maxdepth 2 -type f -printf '%P\n' | sort
            if test -f candidate-artifact/package-lock.candidate.json; then
              sha256sum candidate-artifact/package-lock.candidate.json
              test "$(sha256sum candidate-artifact/package-lock.candidate.json | awk '{print $1}')" = "$EXPECTED_CANDIDATE_LOCK_SHA256"
              echo "candidate_lock_sha_check_rc=$?"
            fi
            if test -f candidate-artifact/candidate-lock-sha256.txt; then
              cat candidate-artifact/candidate-lock-sha256.txt
            fi
          fi
          exit 0

      - name: Publish diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-determinism-candidate-diagnostic-${{ github.sha }}
          if-no-files-found: warn
          path: |
            artifact-api.headers
            artifact-api.json
            artifact-download.headers
            candidate-artifact.zip
            candidate-artifact/
